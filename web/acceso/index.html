<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Entrar a Works</title>
    <link rel="stylesheet" href="/estilos/tokens.css" />
    <link rel="stylesheet" href="/estilos/base.css" />
    <link rel="stylesheet" href="/estilos/componentes.css" />
    <link rel="stylesheet" href="/acceso/acceso.css" />
  </head>
  <body>
    <main class="acceso" aria-live="polite">
      <section class="tarjeta acceso__tarjeta">
        <div class="acceso__estado" aria-hidden="true">
          <span
            class="acceso__icono acceso__icono--cargando"
            data-icono-acceso="loader-circle"
          ></span>
          <span
            class="acceso__icono acceso__icono--error"
            data-icono-acceso="circle-x"
          ></span>
        </div>
        <div class="acceso__contenido">
          <p class="acceso__etiqueta">Acceso seguro</p>
          <h1 class="acceso__titulo">Entrando a Works</h1>
          <p class="acceso__mensaje" data-acceso-mensaje>
            Estamos preparando tu acceso.
          </p>
        </div>
      </section>
    </main>
    <script type="module" src="/acceso/acceso.js"></script>
    <script type="module">
      import { ponerIcono } from "/componentes/icono.js";

      document.querySelectorAll("[data-icono-acceso]").forEach((elemento) => {
        ponerIcono(elemento, elemento.dataset.iconoAcceso, {
          tamano: 28,
          grosor: 2.8,
        });
      });
    </script>
  </body>
</html>
