<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Works · muestra de componentes</title>
    <link rel="stylesheet" href="/estilos/tokens.css" />
    <link rel="stylesheet" href="/estilos/base.css" />
    <link rel="stylesheet" href="/estilos/componentes.css" />
    <style>
      #app {
        display: flex;
        flex-direction: column;
        gap: var(--espacio-5);
      }
    </style>
  </head>
  <body>
    <main id="app">
      <section class="superficie">
        <p>Superficie con relieve, sin texto importante encima.</p>
      </section>

      <article class="tarjeta">
        <h2 class="tarjeta__titulo">Oficina 204</h2>
        <p class="tarjeta__texto-secundario">Vence en 12 días</p>
      </article>

      <button type="button" class="boton" id="boton-muestra">
        Registrar pago
      </button>

      <form class="campo-texto">
        <label class="campo-texto__etiqueta" for="campo-muestra">
          Titular
        </label>
        <input
          class="campo-texto__control"
          id="campo-muestra"
          type="text"
          value="Titular Sintético 07"
        />
      </form>

      <a class="enlace-discreto" href="#detalle">Ver todo</a>
    </main>
  </body>
</html>
