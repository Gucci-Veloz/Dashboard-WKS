<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Works · muestra de nivel 1</title>
    <link rel="stylesheet" href="/estilos/tokens.css" />
    <link rel="stylesheet" href="/estilos/base.css" />
    <link rel="stylesheet" href="/nivel1/nivel1.css" />
    <link rel="stylesheet" href="/nivel2/nivel2.css" />
    <link rel="stylesheet" href="/indicadores/indicadores.css" />
  </head>
  <body>
    <main id="app"></main>
    <script type="module">
      import { obtenerEstado } from "/datos/estado.js";
      import { renderNivel1 } from "/nivel1/nivel1.js";
      import { renderNivel2 } from "/nivel2/nivel2.js";
      import { renderIndicadores } from "/indicadores/indicadores.js";

      const parametros = new URLSearchParams(window.location.search);
      const escenario = parametros.get("escenario") || "tranquilo";

      obtenerEstado(escenario).then((estado) => {
        const contenedor = document.getElementById("app");
        renderNivel1(contenedor, estado);
        renderNivel2(contenedor, estado);
        renderIndicadores(contenedor, estado);
      });
    </script>
  </body>
</html>
